<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>你對懷恩堂數位事工的期待 | 懷恩堂差傳年會</title>
  <meta name="description" content="與 200 人一起點亮星光，分享你對數位事工的期待">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=16">
</head>
<body>
  <div id="app">

    <!-- 頁首 (加入點擊重整功能) -->
    <header id="main-header" onclick="window.location.reload(true)" style="cursor: pointer;" title="點擊重新整理">
      <h1 id="main-title">你對懷恩堂數位事工的期待 <span class="version-badge">(v16)</span></h1>
      <p class="subtitle">請輸入簡短的文字，為每份期盼能做成新事工禱告</p>
    </header>

    <!-- 字雲區 -->
    <section id="cloud-section">
      <div id="cloud-container">
        <canvas id="word-cloud"></canvas>
        <div id="cloud-empty">還沒有期許，趕快發送第一個吧！</div>
      </div>
    </section>

    <!-- 公開留言牆 -->
    <section id="feed-section">
      <div class="feed-header">
        <h2>💬 大家的期待</h2>
        <span id="feed-meta"></span>
      </div>
      <div id="feed-list">
        <div class="feed-skeleton" id="feed-loading">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      </div>
      <!-- 分頁控制區 -->
      <div id="feed-pagination"></div>
    </section>

    <!-- 底部輸入列 -->
    <footer id="input-footer">
      <div id="input-bar">
        <input
          type="text"
          id="keyword-input"
          placeholder="輸入你對數位事工的期許..."
          maxlength="50"
          autocomplete="off"
        >
        <button id="submit-btn">發送</button>
      </div>
    </footer>

  </div>

  <!-- 懸浮篩選狀態標籤 -->
  <div id="filter-badge">
    <span class="filter-icon">🔍</span>
    <span id="filter-label"></span>
    <button id="clear-filter" onclick="clearFilter()">✕ 清除篩選</button>
  </div>

  <button id="rotate-reload-btn" onclick="window.location.reload(true)">↻ 重整版面</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
  <script src="app.js?v=16"></script>
</body>
</html>
