<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>懷恩堂 - 數位禾場呼召</title>
    <!-- 引入極簡中文字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 頂部標題 -->
        <header>
            <h1>數位禾場的期待</h1>
            <p>與 200 人一起點亮星光</p>
        </header>

        <!-- 字雲顯示區 -->
        <div class="cloud-container" id="cloud-container">
            <canvas id="word-cloud"></canvas>
            <div id="loading" class="loading">正在載入祈願...</div>
        </div>

        <!-- 輸入區塊 -->
        <div class="input-section">
            <input type="text" id="keyword-input" placeholder="輸入你想對數位事工的期許..." maxlength="15">
            <button id="submit-btn">發送</button>
        </div>

        <!-- 歷史紀錄與刪除區塊 -->
        <div class="history-section" id="history-section">
            <h3>您的期許紀錄</h3>
            <ul id="history-list">
                <!-- 紀錄將由 JS 動態生成 -->
            </ul>
        </div>
    </div>

    <!-- 引入字雲套件 wordcloud2.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
