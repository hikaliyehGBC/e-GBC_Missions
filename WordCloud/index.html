<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>你對懷恩堂數位事工的期待 | 懷恩堂差傳年會</title>
  <meta name="description" content="分享你對數位事工的期待與想像">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=17">
  <style>
    .lang-toggle-btn {
      position: absolute;
      right: 10px;
      top: 10px;
      background: transparent;
      border: 1.5px solid #2C3E50;
      color: #2C3E50;
      border-radius: 20px;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      transition: all 0.2s;
    }
    .lang-toggle-btn:hover {
      background: #2C3E50;
      color: #fff;
    }
    #main-header {
      position: relative;
    }
  </style>
</head>

<body>
  <div id="app">

    <!-- 頁首 (加入點擊重整功能) -->
    <header id="main-header" onclick="window.location.reload(true)" style="cursor: pointer;" title="點擊重新整理">
      <h1 id="main-title" data-i18n="title">你對懷恩堂數位事工的期待</h1>
      <p class="subtitle" data-i18n="subtitle">輸入簡短文字，為每份期盼作成新事工禱告</p>
      <button id="langToggleBtn" class="lang-toggle-btn">EN</button>
    </header>

    <!-- 字雲區 -->
    <section id="cloud-section">
      <div id="cloud-container">
        <canvas id="word-cloud"></canvas>
        <div id="cloud-empty" data-i18n="cloud-empty">還沒有期許，趕快發送第一個吧！</div>
      </div>
    </section>

    <!-- 公開留言牆 -->
    <section id="feed-section">
      <div class="feed-header">
        <h2 data-i18n="feed-title">💬 大家的期待</h2>
        <span id="feed-meta"></span>
      </div>
      <div id="feed-list">
        <div class="feed-skeleton" id="feed-loading">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      </div>
      <!-- 分頁控制區 -->
      <div id="feed-pagination"></div>
    </section>

    <!-- 底部輸入列 -->
    <footer id="input-footer">
      <div id="input-bar">
        <input type="text" id="keyword-input" data-i18n-placeholder="input-placeholder" placeholder="輸入對數位事工的期許..." maxlength="50" autocomplete="off">
        <button id="submit-btn" data-i18n="submit-btn">發送</button>
      </div>
    </footer>

    <!-- 版權說明 Footer -->
    <div class="site-copyright">
      <p data-i18n="footer-copy1">e-gbc 2026差傳年會 數位事工禱告互動頁面</p>
      <p><span data-i18n="footer-copy2">如有疑問或建議，請聯絡資訊同工 嘉惠：</span><a href="mailto:hikaliyeh@gbc.org.tw">hikaliyeh@gbc.org.tw</a></p>
    </div>

  </div>

  <!-- 懸浮篩選狀態標籤 -->
  <div id="filter-badge">
    <span class="filter-icon">🔍</span>
    <span id="filter-label"></span>
    <button id="clear-filter" onclick="clearFilter()" data-i18n="clear-filter">✕ 清除篩選</button>
  </div>

  <button id="rotate-reload-btn" onclick="window.location.reload(true)" data-i18n="rotate-btn">↻ 重整版面</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
  <script src="app.js?v=18"></script>
</body>

</html>
